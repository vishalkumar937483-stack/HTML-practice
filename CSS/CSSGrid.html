<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{background-color: bisque;
        border: 12px solid red;
        padding: 20px;
        display:grid;
        grid-template-columns: 40% auto auto;
        grid-template-rows:100px 100px 100px;
        grid-row-gap: 20px;
        grid-column-gap:20px;
        flex-wrap: wrap;}




        .item{background-color: rgb(255, 210, 217) ;
        border:2px solid black;
        }

        #i4{grid-column-start:2;
            grid-column-end:span 3;}
        
        #i7{grid-row-start:2;
            grid-row-end:4}
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Div 1</div>
        <div class="item">Div 2</div>
        <div class="item">Div 3</div>
        <div class="item" id="i4">Div 4</div>
        <div class="item">Div 5</div>
        <div class="item">Div 6</div>
        <div class="item" id="i7">Div 7</div>
        <div class="item">Div 8</div>
    </div>
</body>
</html>
